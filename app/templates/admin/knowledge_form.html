{% extends "admin/base.html" %}
{% block title %}{{ '编辑文章' if article else '新增文章' }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ '编辑文章' if article else '新增文章' }}</h1>
<form method="post" class="card border-0 shadow-sm">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">分类 *</label>
        <select class="form-select" name="category_id" required>
          {% for category in categories %}
          <option value="{{ category.id }}" {% if article and article.category_id == category.id %}selected{% endif %}>{{ category.icon }} {{ category.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-8">
        <label class="form-label">标题 *</label>
        <input class="form-control" name="title" required value="{{ article.title if article else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">摘要</label>
        <textarea class="form-control" name="summary" rows="2">{{ article.summary if article else '' }}</textarea>
      </div>
      <div class="col-12">
        <label class="form-label">正文 *</label>
        <textarea class="form-control" name="content" rows="10" required>{{ article.content if article else '' }}</textarea>
      </div>
      <div class="col-md-8">
        <label class="form-label">封面占位图 URL</label>
        <input class="form-control" name="cover_url" value="{{ article.cover_url if article else 'https://placehold.co/750x420/png?text=Knowledge' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">来源</label>
        <input class="form-control" name="source" value="{{ article.source if article else '校园健身房' }}">
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="is_published" id="is_published" {% if not article or article.is_published %}checked{% endif %}>
          <label class="form-check-label" for="is_published">发布到小程序</label>
        </div>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary" type="submit">保存</button>
      <a class="btn btn-secondary" href="{{ url_for('admin.knowledge_list') }}">返回</a>
    </div>
  </div>
</form>
{% endblock %}
